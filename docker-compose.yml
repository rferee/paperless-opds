services:
  paperless-opds:
    image: docker-registry.internal.rferee.dev/services/paperless-opds:latest
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_URL: "https://paperless.example.com"
      PAPERLESS_API_KEY: "your-api-key-here"
      # OPDS_TITLE: "My Library"
      # OPDS_PAGE_SIZE: "25"
      # CACHE_TTL: "300"
      # OPDS_USERNAME: "reader"
      # OPDS_PASSWORD: "secret"
      # THUMBNAIL_DIR: "/data/thumbnails"
      # THUMBNAIL_PREGENERATE: "true"
      # THUMB_MAX_SIZE: "300"
      # PREVIEW_MAX_SIZE: "1000"
      # OPDS_INCLUDE_CONTENT: "false"
    volumes:
      - thumbnails:/data/thumbnails
    restart: unless-stopped

volumes:
  thumbnails:
